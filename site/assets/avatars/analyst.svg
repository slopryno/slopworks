<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Analyst as a spider, Halloween" stroke-linecap="round" stroke-linejoin="round"><style>.s,.q,.g,.e{animation:3.4s -1.04s ease-in-out infinite}.s{animation-name:s;transform-origin:50px 0px}.q{animation-name:q;transform-origin:50px 90px}.g{animation-name:g}.e{animation-name:e;transform-box:fill-box;transform-origin:center}@keyframes s{0%,50%,to{transform:rotate(0)}25%{transform:rotate(8deg)}75%{transform:rotate(-8deg)}}@keyframes q{0%,50%,to{transform:scale(0.98,1.02)}25%,75%{transform:scale(1.03,0.97)}}@keyframes g{0%,50%,to{transform:none}25%{transform:translateX(-3.2px)}75%{transform:translateX(3.2px)}}@keyframes e{0%,10%,50%,60%,to{transform:none}25%,75%{transform:scale(1.32,.7)}}.lg{animation:lg 1.2s ease-in-out infinite;transform-origin:50px 63px}@keyframes lg{50%{transform:scaleY(.9)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="s"><g class="q"><path d="M50 0V48" fill="none" stroke="#868b9e" stroke-width="1.2"/><g class="lg"><path d="M37 56Q24 46 17 52M35 62Q21 58 15 66M36 68Q23 72 17 80M39 72Q30 82 26 90" fill="none" stroke="#8a63e8" stroke-width="3.2"/><g transform="matrix(-1 0 0 1 100 0)"><path d="M37 56Q24 46 17 52M35 62Q21 58 15 66M36 68Q23 72 17 80M39 72Q30 82 26 90" fill="none" stroke="#8a63e8" stroke-width="3.2"/></g></g><ellipse cx="50" cy="63" rx="16" ry="15" fill="#a371f7"/><g class="g" fill="#1b1f24"><ellipse class="e" cx="45" cy="64" rx="3" ry="5.6"/><ellipse class="e" cx="55" cy="64" rx="3" ry="5.6"/></g></g></g><g transform="translate(80 82)"><circle r="10" fill="#7551b1"/><path d="M-3 4v-3M0 4v-8M3 4v-5" fill="none" stroke="#fff" stroke-width="1.8"/></g></svg>
