<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Critic as a devil's advocate, Halloween" stroke-linecap="round" stroke-linejoin="round"><style>.s,.q,.g,.e{animation:2.3s -0.58s ease-in-out infinite}.s{animation-name:s;transform-origin:50px 90px}.q{animation-name:q;transform-origin:50px 90px}.g{animation-name:g}.e{animation-name:e;transform-box:fill-box;transform-origin:center}@keyframes s{50%{transform:translateY(0)}25%{transform:translateY(-7px) rotate(-5deg)}75%{transform:translateY(-7px) rotate(5deg)}}@keyframes q{0%,50%,to{transform:scale(1.09,0.9)}25%,75%{transform:scale(0.95,1.07)}}@keyframes g{50%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}@keyframes e{10%,50%,60%{transform:none}25%,75%{transform:scale(1.32,.7)}}.tl{animation:tl 1.15s ease-in-out infinite;transform-origin:70px 80px}@keyframes tl{50%{transform:rotate(-16deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="s"><g class="q"><g class="tl"><path d="M70 80Q87 82 85 64" fill="none" stroke="#c63833" stroke-width="3.6"/><path d="M85 56L78 67L91 65Z" fill="#c63833"/></g><path d="M32 48Q23 34 30 22Q34 36 43 42Z" fill="#c63833"/><g transform="matrix(-1 0 0 1 100 0)"><path d="M32 48Q23 34 30 22Q34 36 43 42Z" fill="#c63833"/></g><ellipse cx="50" cy="65" rx="25" ry="24" fill="#f0883e" stroke="#c57033" stroke-width="4" paint-order="stroke"/><g class="g" fill="#1b1f24"><ellipse class="e" cx="43" cy="65" rx="3.6" ry="6.4"/><ellipse class="e" cx="57" cy="65" rx="3.6" ry="6.4"/></g></g></g><g transform="translate(80 82)"><circle r="10" fill="#ac612c"/><path d="M0-5v5M0 4v.5" fill="none" stroke="#fff" stroke-width="1.8"/></g></svg>
