<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Polish as a witch, Halloween" stroke-linecap="round" stroke-linejoin="round"><style>.s,.q,.g,.e{animation:2.9s -0.06s ease-in-out infinite}.s{animation-name:s;transform-origin:50px 90px}.q{animation-name:q;transform-origin:50px 90px}.g{animation-name:g}.e{animation-name:e;transform-box:fill-box;transform-origin:center}@keyframes s{50%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}@keyframes q{0%,50%,to{transform:scale(0.96,1.04)}25%,75%{transform:scale(1.08,0.92)}}@keyframes g{50%{transform:none}25%{transform:translateX(-3.2px)}75%{transform:translateX(3.2px)}}@keyframes e{10%,50%,60%{transform:none}25%,75%{transform:scale(1.32,.7)}}.tp{animation:tp 2.9s ease-in-out infinite;transform-origin:50px 58px}@keyframes tp{25%{transform:skewX(10deg)}75%{transform:skewX(-10deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="s"><g class="q"><ellipse cx="50" cy="74" rx="25" ry="17" fill="#e05aa8"/><g class="tp"><path d="M32 58Q42 46 46 28Q48 16 34 8Q60 12 60 30Q62 46 68 58Z" fill="#8f62dc"/></g><rect x="18" y="55" width="64" height="7" rx="3.5" fill="#8f62dc"/><rect x="34" y="50" width="32" height="5" rx="1.5" fill="#f2c14e"/><g class="g" fill="#1b1f24"><ellipse class="e" cx="44" cy="74" rx="3.2" ry="5.6"/><ellipse class="e" cx="56" cy="74" rx="3.2" ry="5.6"/></g></g></g><g transform="translate(80 82)"><circle r="10" fill="#892962"/><path d="M0-6l1.5 4.5L6 0l-4.5 1.5L0 6l-1.5-4.5L-6 0l4.5-1.5z" fill="#fff"/></g></svg>
