name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review] # ready_for_review re-runs the gates after sign-offs
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # only to add the needs-ceo label and comment; fork PRs get read-only
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: No files over 1MB
        run: |
          big=$(find . -path ./.git -prune -o -type f -size +1M -print)
          if [ -n "$big" ]; then echo "Files over 1MB:"; echo "$big"; exit 1; fi
      - name: Site has HTML
        run: |
          test -f site/index.html || { echo "site/index.html missing"; exit 1; }
      - name: Secret pattern scan
        run: |
          if grep -rInE 'AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY|xox[baprs]-[A-Za-z0-9-]{10,}' --exclude-dir=.git --exclude=ci.yml .; then
            echo "Possible secret found"; exit 1
          fi
      - name: Guarded paths (backup to CODEOWNERS)
        if: github.event_name == 'pull_request'
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$AUTHOR" = "slopryno" ]; then exit 0; fi
          hits=$(git diff --name-only "$BASE" "$HEAD" | grep -E '^(\.github|bots|plans)/' || true)
          if [ -n "$hits" ]; then echo "PR by $AUTHOR touches guarded paths:"; echo "$hits"; exit 1; fi
      - name: Unit tests for the checks
        run: python3 -m unittest discover -s tests -v
      - name: Repo checks (schema, duplicate IDs, sources, secrets, personal data, file types, accessibility, page weight, schedule)
        env:
          LINKCHECK: "1"
        run: python3 scripts/check.py repo
      - name: Site is built from data
        run: python3 scripts/build.py --check
      - name: bot/data-* path rule
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check.py paths
      - name: guardrail-gate
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check.py guardrail-gate
      - name: review-gate
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check.py review-gate
